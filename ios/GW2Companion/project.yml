name: GW2Companion
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GW2Companion:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GW2 Companion
        NSCameraUsageDescription: Scan the pairing QR code shown by GW2 Companion Bridge.
        NSLocalNetworkUsageDescription: GW2 Companion uses your local network to receive live Guild Wars 2 position data from GW2 Companion Bridge on your PC.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GW2Companion
        DEVELOPMENT_TEAM: CA4ZH8R7Y7
        CODE_SIGN_IDENTITY: iPhone Developer
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  GW2CompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GW2Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GW2CompanionTests
        GENERATE_INFOPLIST_FILE: YES
  GW2CompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GW2Companion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.GW2CompanionUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GW2Companion:
    build:
      targets:
        GW2Companion: all
        GW2CompanionTests: [test]
    test:
      targets:
        - GW2CompanionTests
        - GW2CompanionUITests
